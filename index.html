<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SUBMUNDO" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&display=swap" rel="stylesheet" />
    <title>SUBMUNDO</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body,
      #game-container,
      #game-container canvas {
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        background-color: #09090b;
        color: #f4f4f5;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game-container {
        width: min(100vw, calc(100vh * 16 / 9));
        height: min(100vh, calc(100vw * 9 / 16));
        width: min(100vw, calc(100dvh * 16 / 9));
        height: min(100dvh, calc(100vw * 9 / 16));
        max-width: 100vw;
        max-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid #27272a;
        box-shadow: 0 0 28px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(212, 160, 23, 0.14);
        background-color: #09090b;
        overflow: hidden;
      }
      #game-container canvas {
        display: block;
      }
      @media (max-width: 960px) {
        #game-container {
          width: 100vw;
          height: 100vh;
          height: 100dvh;
          border: none;
          box-shadow: none;
        }
      }
      #rotate-overlay {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: radial-gradient(circle at center, rgba(24, 16, 22, 0.96) 0%, rgba(9, 9, 11, 0.99) 75%);
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      #rotate-overlay .rotate-card {
        width: 100%;
        max-width: 340px;
        padding: 28px 24px;
        border-radius: 10px;
        border: 1px solid rgba(212, 160, 23, 0.35);
        background: rgba(16, 14, 20, 0.94);
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.85), inset 0 1px 0 rgba(245, 208, 122, 0.12);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      #rotate-overlay .rotate-icon {
        width: 68px;
        height: 68px;
        color: #e6b85c;
        animation: submundo-rotate-hint 2.4s ease-in-out infinite;
      }
      @keyframes submundo-rotate-hint {
        0%, 20% {
          transform: rotate(0deg);
        }
        50%, 75% {
          transform: rotate(-90deg);
        }
        100% {
          transform: rotate(0deg);
        }
      }
      #rotate-overlay h2 {
        font-family: 'Cinzel', Georgia, serif;
        font-size: 1.25rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: #f5d07a;
      }
      #rotate-overlay p {
        font-size: 0.92rem;
        line-height: 1.45;
        color: #d4d4d8;
      }
      #rotate-dismiss-btn {
        margin-top: 6px;
        padding: 8px 16px;
        border-radius: 6px;
        border: 1px solid rgba(161, 161, 170, 0.32);
        background: rgba(39, 39, 42, 0.65);
        color: #a1a1aa;
        font-size: 0.8rem;
        letter-spacing: 0.02em;
        cursor: pointer;
        touch-action: manipulation;
      }
      #rotate-dismiss-btn:active {
        background: rgba(63, 63, 70, 0.85);
        color: #f4f4f5;
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate-overlay {
          display: flex;
        }
      }
      #rotate-overlay[data-dismissed='true'] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <div id="rotate-overlay" role="dialog" aria-modal="true" aria-labelledby="rotate-overlay-title">
      <div class="rotate-card">
        <svg class="rotate-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect x="20" y="10" width="24" height="44" rx="4" stroke="currentColor" stroke-width="2.5" />
          <line x1="28" y1="48" x2="36" y2="48" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
          <path d="M12 28C10 18 16 10 24 8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
          <path d="M9 24L12 29L16 25" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M52 36C54 46 48 54 40 56" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
          <path d="M55 40L52 35L48 39" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <h2 id="rotate-overlay-title">GIRE O DISPOSITIVO</h2>
        <p>SUBMUNDO é jogado em modo paisagem (horizontal) com as duas mãos.</p>
        <button id="rotate-dismiss-btn" type="button">Continuar mesmo assim</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
